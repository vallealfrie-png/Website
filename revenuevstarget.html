<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Revenue Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; }
        .glowing-border {
            position: relative;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glowing-border::before {
            content: ""; position: absolute; inset: -1px; border-radius: 28px; padding: 1.5px; 
            background: linear-gradient(135deg, #6366f1, transparent 40%, transparent 60%, #a855f7);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <nav class="border-b border-white/5 px-8 py-5 mb-10 bg-slate-900/40 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl shadow-[0_0_20px_rgba(99,102,241,0.4)] flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    </div>
                    <h1 class="text-lg font-extrabold tracking-tight text-white uppercase">Revenue Intel</h1>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 space-y-8">
        <div class="glowing-border p-2 flex flex-wrap gap-2 items-center">
            <select id="monthSelect" class="flex-1 bg-transparent text-sm p-4 font-bold text-white outline-none cursor-pointer rounded-xl">
                <option class="bg-slate-900" value="ALL">Year-to-Date (All Months)</option>
            </select>
            <select id="deptSelect" class="flex-1 bg-transparent text-sm p-4 font-bold text-white outline-none cursor-pointer rounded-xl border-l border-white/10">
                <option class="bg-slate-900" value="ALL">Consolidated Hospital</option>
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glowing-border p-8">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">2026 Actual Revenue</p>
                <h3 id="score2026" class="text-4xl font-black text-white tracking-tighter">₱0</h3>
            </div>
            <div class="glowing-border p-8">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">2026 Target Goal</p>
                <h3 id="targetTextTop" class="text-4xl font-black text-indigo-400 tracking-tighter">₱0</h3>
            </div>
            <div class="glowing-border p-8">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">YoY Growth (vs 2025)</p>
                <h3 id="growthValue" class="text-4xl font-black tracking-tighter">0%</h3>
            </div>
        </div>

        <div class="glowing-border p-12">
            <div class="flex flex-col lg:flex-row items-center justify-between gap-10">
                <div class="flex-1 text-center lg:text-left">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Current Revenue</p>
                    <p id="revText" class="text-4xl font-black text-indigo-400">₱0</p>
                </div>
                <div class="flex-[3] w-full h-[350px]">
                    <div id="gaugeContainer" class="w-full h-full"></div>
                </div>
                <div class="flex-1 text-center lg:text-right">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Target Quota</p>
                    <p id="targetText" class="text-4xl font-black text-white">₱0</p>
                </div>
            </div>
        </div>

        <div class="glowing-border p-10">
            <div id="comparisonContainer" class="h-[400px]"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhldmarwkulkcjnrjvfk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpobGRtYXJ3a3Vsa2NqbnJqdmZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyODAzMjQsImV4cCI6MjA5MTg1NjMyNH0.AhjpHXlZSgWNlEshgc0giSSUvHV249f34424i-5g8do';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let gaugeChart, comparisonChart;
        const MONTH_ORDER = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        // Helper to safely clean and convert any value to a number
        const parseVal = (val) => {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return val;
            return parseFloat(val.toString().replace(/[₱, ]/g, '')) || 0;
        };

        function animateValue(id, start, end, duration, isCurrency = true) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const value = Math.floor(progress * (end - start) + start);
                obj.innerHTML = isCurrency ? '₱' + value.toLocaleString() : (end >= 0 ? '+' : '') + value + '%';
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function initCharts() {
            gaugeChart = Highcharts.chart('gaugeContainer', {
                chart: { type: 'gauge', backgroundColor: 'transparent', margin: [0, 0, 40, 0] },
                title: null,
                pane: { startAngle: -120, endAngle: 120, background: null, center: ['50%', '85%'], size: '110%' },
                yAxis: {
                    min: 0, max: 100, lineWidth: 0, tickWidth: 0, minorTickWidth: 0, labels: { enabled: false },
                    plotBands: [{ from: 0, to: 100, color: '#ff1e56', thickness: 50 }]
                },
                series: [{
                    name: 'Achievement', data: [0],
                    dataLabels: {
                        enabled: true, useHTML: true, y: -40,
                        format: '<div style="background:#6366f1; color:white; padding: 8px 20px; border-radius: 12px; font-weight:900; font-size:28px; border: 2px solid #fff;">{y}%</div>'
                    },
                    dial: { radius: '90%', backgroundColor: '#fff', baseWidth: 8 },
                    pivot: { backgroundColor: '#fff', radius: 8 }
                }],
                credits: { enabled: false }
            });

            comparisonChart = Highcharts.chart('comparisonContainer', {
                chart: { type: 'column', backgroundColor: 'transparent' },
                title: { text: 'Monthly Performance: 2025 vs 2026 vs Target', style: { color: '#fff', fontSize: '14px', fontWeight: '800' } },
                xAxis: { categories: [], labels: { style: { color: '#94a3b8' } }, lineWidth: 0 },
                yAxis: { title: { text: null }, gridLineColor: 'rgba(255,255,255,0.05)', labels: { style: { color: '#475569' } } },
                tooltip: { shared: true, borderRadius: 12 },
                series: [
                    { name: '2025 Revenue', color: '#1e293b', data: [] },
                    { name: '2026 Revenue', color: '#6366f1', data: [] },
                    { name: '2026 Target', color: '#a855f7', data: [], dashStyle: 'Dot' } // Added Target series
                ],
                credits: { enabled: false }
            });
        }

        async function refreshData() {
            const selectedMonth = document.getElementById('monthSelect').value;
            const selectedDept = document.getElementById('deptSelect').value;

            // Fetch ALL data from the table
            let { data: rawData, error } = await supabaseClient.from('revenue_targets').select('*').limit(2000);
            if (error) { console.error("Supabase Error:", error); return; }

            // 1. Filter by Department
            let deptData = selectedDept === 'ALL' ? rawData : rawData.filter(d => d.department === selectedDept);

            // 2. Filter for specific Month metrics
            let metricsData = selectedMonth === 'ALL' ? deptData : deptData.filter(d => d.month.trim() === selectedMonth.trim());

            // 3. Totals
            const curRev = metricsData.filter(d => d.year == 2026).reduce((s, r) => s + parseVal(r.revenue), 0);
            const curTarget = metricsData.filter(d => d.year == 2026).reduce((s, r) => s + parseVal(r.target), 0);
            const oldRev = metricsData.filter(d => d.year == 2025).reduce((s, r) => s + parseVal(r.revenue), 0);
            
            const achieve = curTarget > 0 ? Math.round((curRev / curTarget) * 100) : 0;
            const growth = oldRev > 0 ? Math.round(((curRev - oldRev) / oldRev) * 100) : 0;

            // Update UI
            animateValue('score2026', 0, curRev, 1000);
            animateValue('targetTextTop', 0, curTarget, 1000);
            animateValue('growthValue', 0, growth, 1000, false);
            animateValue('revText', 0, curRev, 1000);
            animateValue('targetText', 0, curTarget, 1000);
            document.getElementById('growthValue').className = `text-4xl font-black ${growth >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            // Update Gauge
            const gaugeColor = achieve >= 100 ? '#32ff7e' : '#ff1e56';
            gaugeChart.yAxis[0].update({ plotBands: [{ from: 0, to: 100, color: gaugeColor, thickness: 50 }] }, false);
            gaugeChart.series[0].points[0].update({ y: achieve > 115 ? 115 : achieve });

            // 4. Dynamic Bar Chart (Detects Apr, May, etc. automatically)
            const availableMonths = [...new Set(rawData.map(d => d.month.trim()))]
                .sort((a, b) => MONTH_ORDER.indexOf(a) - MONTH_ORDER.indexOf(b));
            
            comparisonChart.update({ xAxis: { categories: availableMonths } }, false);
            
            // Series 0: 2025 Rev
            comparisonChart.series[0].setData(availableMonths.map(m => deptData.filter(d => d.year == 2025 && d.month.trim() == m).reduce((s, r) => s + parseVal(r.revenue), 0)), false);
            // Series 1: 2026 Rev
            comparisonChart.series[1].setData(availableMonths.map(m => deptData.filter(d => d.year == 2026 && d.month.trim() == m).reduce((s, r) => s + parseVal(r.revenue), 0)), false);
            // Series 2: 2026 Target
            comparisonChart.series[2].setData(availableMonths.map(m => deptData.filter(d => d.year == 2026 && d.month.trim() == m).reduce((s, r) => s + parseVal(r.target), 0)), true);
        }

        window.onload = async () => {
            initCharts();
            
            const { data } = await supabaseClient.from('revenue_targets').select('department, month').limit(2000);
            if (!data) return;

            // Auto-populate Departments
            const uniqueDepts = [...new Set(data.map(item => item.department))].sort();
            uniqueDepts.forEach(dept => {
                const opt = document.createElement('option');
                opt.value = dept; opt.innerHTML = dept; opt.className = "bg-slate-900";
                document.getElementById('deptSelect').appendChild(opt);
            });

            // Auto-populate Months (finds April, etc. automatically)
            const uniqueMonths = [...new Set(data.map(item => item.month.trim()))]
                .sort((a, b) => MONTH_ORDER.indexOf(a) - MONTH_ORDER.indexOf(b));
            uniqueMonths.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.innerHTML = m; opt.className = "bg-slate-900";
                document.getElementById('monthSelect').appendChild(opt);
            });

            document.getElementById('monthSelect').addEventListener('change', refreshData);
            document.getElementById('deptSelect').addEventListener('change', refreshData);
            refreshData();
        };
    </script>
</body>
</html>
