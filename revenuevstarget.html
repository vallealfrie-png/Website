<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Revenue Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; }
        .glowing-border {
            position: relative;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glowing-border::before {
            content: ""; position: absolute; inset: -1px; border-radius: 28px; padding: 1.5px; 
            background: linear-gradient(135deg, #6366f1, transparent 40%, transparent 60%, #a855f7);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <nav class="border-b border-white/5 px-8 py-5 mb-10 bg-slate-900/40 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center">
                <a href="index.html" class="flex items-center space-x-2 group">
                    <div class="w-8 h-8 bg-slate-800 border border-white/10 rounded-lg flex items-center justify-center group-hover:bg-indigo-600 group-hover:border-indigo-400 transition-all duration-300">
                        <svg class="w-4 h-4 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                    </div>
                    <span class="text-[11px] font-black uppercase tracking-widest text-slate-400 group-hover:text-white transition-colors">Home</span>
                </a>
                <div class="h-6 w-[1px] bg-white/10 mx-6"></div>
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    </div>
                    <h1 class="text-lg font-extrabold tracking-tight text-white uppercase">Revenue Intel</h1>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 space-y-8">
        <div class="glowing-border p-2 flex flex-wrap gap-2 items-center">
            <select id="monthSelect" class="flex-1 bg-transparent text-sm p-4 font-bold text-white outline-none cursor-pointer rounded-xl">
                <option class="bg-slate-900" value="ALL">Year-to-Date (All Months)</option>
            </select>
            <select id="deptSelect" class="flex-1 bg-transparent text-sm p-4 font-bold text-white outline-none cursor-pointer rounded-xl border-l border-white/10">
                <option class="bg-slate-900" value="ALL">Consolidated Hospital</option>
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glowing-border p-8 text-center sm:text-left">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">2026 Actual Revenue</p>
                <h3 id="score2026" class="text-3xl lg:text-4xl font-black text-white tracking-tighter">₱0</h3>
            </div>
            <div class="glowing-border p-8 text-center sm:text-left">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">2026 Target Goal</p>
                <h3 id="targetTextTop" class="text-3xl lg:text-4xl font-black text-indigo-400 tracking-tighter">₱0</h3>
            </div>
            <div class="glowing-border p-8 text-center sm:text-left">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Goal Percentage</p>
                <h3 id="growthValue" class="text-3xl lg:text-4xl font-black tracking-tighter text-white">0%</h3>
            </div>
        </div>

        <div class="glowing-border p-8 lg:p-12">
            <div class="flex flex-col lg:flex-row items-center justify-between gap-6 lg:gap-10">
                <div class="flex-1 text-center lg:text-left min-w-[150px]">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Current Revenue</p>
                    <p id="revText" class="text-2xl lg:text-3xl font-black text-indigo-400">₱0</p>
                </div>
                <div class="flex-[3] w-full h-[300px] lg:h-[350px]">
                    <div id="gaugeContainer" class="w-full h-full"></div>
                </div>
                <div class="flex-1 text-center lg:text-right min-w-[150px]">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Target Quota</p>
                    <p id="targetText" class="text-2xl lg:text-3xl font-black text-white">₱0</p>
                </div>
            </div>
        </div>

        <div class="glowing-border p-6 lg:p-10">
            <div id="comparisonContainer" class="h-[400px]"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhldmarwkulkcjnrjvfk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpobGRtYXJ3a3Vsa2NqbnJqdmZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyODAzMjQsImV4cCI6MjA5MTg1NjMyNH0.AhjpHXlZSgWNlEshgc0giSSUvHV249f34424i-5g8do';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let gaugeChart, comparisonChart;
        const MONTH_ORDER = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        const parseVal = (val) => {
            if (val === null || val === undefined) return 0;
            return parseFloat(val.toString().replace(/[₱, ]/g, '')) || 0;
        };

        function animateValue(id, start, end, duration, isCurrency = true) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const value = Math.round(progress * (end - start) + start);
                
                if (isCurrency) {
                    obj.innerHTML = '₱' + value.toLocaleString();
                } else {
                    obj.innerHTML = value + '%';
                    // Alert systems layout based on Target completion benchmarks
                    if (value >= 100) {
                        obj.className = "text-3xl lg:text-4xl font-black tracking-tighter text-[#32ff7e]"; // Green (Goal Achieved)
                    } else if (value < 50) {
                        obj.className = "text-3xl lg:text-4xl font-black tracking-tighter text-[#ff1e56]"; // Red (Needs Attention)
                    } else {
                        obj.className = "text-3xl lg:text-4xl font-black tracking-tighter text-indigo-400"; // Indigo (On track)
                    }
                }
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function initCharts() {
            gaugeChart = Highcharts.chart('gaugeContainer', {
                chart: { type: 'gauge', backgroundColor: 'transparent', margin: [0, 0, 20, 0] },
                title: null,
                pane: { startAngle: -120, endAngle: 120, background: null, center: ['50%', '85%'], size: '100%' },
                yAxis: {
                    min: 0, max: 100, lineWidth: 0, tickWidth: 0, minorTickWidth: 0, labels: { enabled: false },
                    plotBands: [{ from: 0, to: 100, color: '#ff1e56', thickness: 45 }]
                },
                series: [{
                    name: 'Achievement', 
                    data: [0],
                    dataLabels: {
                        enabled: true, useHTML: true, y: -30, borderWidth: 0,
                        formatter: function() {
                            const val = this.point.realValue || 0;
                            return `<div style="background:#0f172a; color:white; padding: 5px 15px; border-radius: 10px; font-weight:900; font-size:22px; border: 2px solid rgba(255,255,255,0.1); min-width: 80px; text-align: center;">${val}%</div>`;
                        }
                    },
                    dial: { radius: '90%', backgroundColor: '#fff', baseWidth: 6 },
                    pivot: { backgroundColor: '#fff', radius: 7 }
                }],
                credits: { enabled: false }
            });

            comparisonChart = Highcharts.chart('comparisonContainer', {
                chart: { type: 'column', backgroundColor: 'transparent' },
                title: { text: 'Monthly Performance Flow', style: { color: '#fff', fontSize: '14px', fontWeight: '800' } },
                xAxis: { categories: [], labels: { style: { color: '#94a3b8' } }, lineWidth: 0 },
                yAxis: { title: { text: null }, gridLineColor: 'rgba(255,255,255,0.05)', labels: { style: { color: '#475569' } } },
                series: [
                    { name: '2025 Revenue', color: '#1e293b', data: [] },
                    { name: '2026 Revenue', color: '#6366f1', data: [] },
                    { name: '2026 Target', color: '#a855f7', data: [] }
                ],
                credits: { enabled: false }
            });
        }

        async function refreshData() {
            const selectedMonth = document.getElementById('monthSelect').value;
            const selectedDept = document.getElementById('deptSelect').value;

            let { data: rawData } = await supabaseClient.from('revenue_targets').select('*').limit(2000);
            if (!rawData) return;

            rawData = rawData.map(d => ({
                ...d, 
                month: (d.month || "").trim(),
                year: parseInt(d.year, 10) || 0
            }));
            
            let deptData = selectedDept === 'ALL' ? rawData : rawData.filter(d => d.department === selectedDept);
            let metricsData = selectedMonth === 'ALL' ? deptData : deptData.filter(d => d.month === selectedMonth);

            const curRev = metricsData.filter(d => d.year === 2026).reduce((s, r) => s + parseVal(r.revenue), 0);
            const curTarget = metricsData.filter(d => d.year === 2026).reduce((s, r) => s + parseVal(r.target), 0);
            
            // FIXED: Calculating Revenue vs Target Goal directly instead of old YoY growth
            const targetPercentage = curTarget > 0 ? Math.round((curRev / curTarget) * 100) : 0;

            animateValue('score2026', 0, curRev, 1000);
            animateValue('targetTextTop', 0, curTarget, 1000);
            animateValue('growthValue', 0, targetPercentage, 1000, false); // Target Rate output
            animateValue('revText', 0, curRev, 1000);
            animateValue('targetText', 0, curTarget, 1000);

            const gaugeColor = targetPercentage >= 100 ? '#32ff7e' : '#ff1e56';
            const pointerValue = targetPercentage > 100 ? 100 : targetPercentage;
            
            gaugeChart.yAxis[0].update({ plotBands: [{ from: 0, to: 100, color: gaugeColor, thickness: 45 }] }, false);
            gaugeChart.series[0].points[0].update({ 
                y: pointerValue, 
                realValue: targetPercentage 
            }, true, { duration: 1000 });

            const availableMonths = [...new Set(rawData.map(d => d.month))]
                .sort((a, b) => {
                    const idxA = MONTH_ORDER.findIndex(m => a.startsWith(m));
                    const idxB = MONTH_ORDER.findIndex(m => b.startsWith(m));
                    return idxA - idxB;
                });
            
            comparisonChart.update({ xAxis: { categories: availableMonths } }, false);
            comparisonChart.series[0].setData(availableMonths.map(m => deptData.filter(d => d.year === 2025 && d.month === m).reduce((s, r) => s + parseVal(r.revenue), 0)), false);
            comparisonChart.series[1].setData(availableMonths.map(m => deptData.filter(d => d.year === 2026 && d.month === m).reduce((s, r) => s + parseVal(r.revenue), 0)), false);
            comparisonChart.series[2].setData(availableMonths.map(m => deptData.filter(d => d.year === 2026 && d.month === m).reduce((s, r) => s + parseVal(r.target), 0)), true);
        }

        window.onload = async () => {
            initCharts();
            const { data } = await supabaseClient.from('revenue_targets').select('department, month').limit(2000);
            if (!data) return;

            const uniqueDepts = [...new Set(data.map(item => item.department))].sort();
            uniqueDepts.forEach(dept => {
                const opt = document.createElement('option');
                opt.value = dept; opt.innerHTML = dept; opt.className = "bg-slate-900";
                document.getElementById('deptSelect').appendChild(opt);
            });

            const uniqueMonths = [...new Set(data.map(item => (item.month || "").trim()))]
                .sort((a, b) => {
                    const idxA = MONTH_ORDER.findIndex(m => a.startsWith(m));
                    const idxB = MONTH_ORDER.findIndex(m => b.startsWith(m));
                    return idxA - idxB;
                });
            uniqueMonths.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.innerHTML = m; opt.className = "bg-slate-900";
                document.getElementById('monthSelect').appendChild(opt);
            });

            document.getElementById('monthSelect').addEventListener('change', refreshData);
            document.getElementById('deptSelect').addEventListener('change', refreshData);
            
            setTimeout(refreshData, 100);
        };
    </script>
</body>
</html>
