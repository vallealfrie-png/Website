<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Revenue Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.highcharts.com/11.4.0/highcharts.js"></script>
    <script src="https://code.highcharts.com/11.4.0/highcharts-more.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #0b0f19; 
            color: #f1f5f9; 
        }
        /* Minimalist scrollbar styling for list items */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Navbar -->
    <nav class="border-b border-slate-800/80 px-8 py-4 mb-8 bg(#0b0f19)/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="website.html" class="flex items-center space-x-2 text-slate-400 hover:text-slate-200 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"></path>
                    </svg>
                    <span class="text-xs font-medium tracking-wider uppercase">Home</span>
                </a>
                <div class="h-4 w-[1px] bg-slate-800"></div>
                <h1 class="text-sm font-semibold tracking-wider text-slate-200 uppercase">KPI Department Revenue & Target</h1>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 space-y-6">
        
        <!-- Dropdown Controls Portfolio -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl px-4 py-1.5">
                <label class="block text-[10px] font-medium text-slate-500 uppercase tracking-wider">Timeline</label>
                <select id="monthSelect" class="w-full bg-transparent text-sm font-medium text-slate-200 outline-none cursor-pointer py-1">
                    <option class="bg-slate-950" value="ALL">Year-to-Date (All Months)</option>
                </select>
            </div>
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl px-4 py-1.5">
                <label class="block text-[10px] font-medium text-slate-500 uppercase tracking-wider">Scope</label>
                <select id="deptSelect" class="w-full bg-transparent text-sm font-medium text-slate-200 outline-none cursor-pointer py-1">
                    <option class="bg-slate-950" value="ALL">Consolidated Hospital</option>
                </select>
            </div>
        </div>

        <!-- Top Overview Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-6">
                <p class="text-[11px] font-medium text-slate-500 uppercase tracking-wider mb-1">2026 Actual Revenue</p>
                <h3 id="score2026" class="text-2xl font-bold text-slate-100 tracking-tight">₱0</h3>
            </div>
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-6">
                <p class="text-[11px] font-medium text-slate-500 uppercase tracking-wider mb-1">2025 Actual Revenue</p>
                <h3 id="score2025" class="text-2xl font-bold text-slate-400 tracking-tight">₱0</h3>
            </div>
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-6">
                <p class="text-[11px] font-medium text-slate-500 uppercase tracking-wider mb-1">YoY Growth</p>
                <h3 id="growthValue" class="text-2xl font-bold tracking-tight text-slate-100">0%</h3>
            </div>
        </div>

        <!-- Gauge & Hit List Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-6 flex flex-col justify-between">
                <div class="flex items-center justify-between gap-4 w-full border-b border-slate-800/50 pb-4 mb-4">
                    <div>
                        <p class="text-[10px] font-medium text-slate-500 uppercase tracking-wider">Current Revenue</p>
                        <p id="revText" class="text-lg font-semibold text-slate-200">₱0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-medium text-slate-500 uppercase tracking-wider">Target Quota</p>
                        <p id="targetText" class="text-lg font-semibold text-slate-400">₱0</p>
                    </div>
                </div>
                <div class="w-full h-[240px]">
                    <div id="gaugeContainer" class="w-full h-full"></div>
                </div>
            </div>

            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-6 flex flex-col">
                <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Achieved Target
                </h4>
                <div id="hitList" class="custom-scrollbar space-y-2 flex-1 overflow-y-auto max-h-[290px] pr-1">
                    <p class="text-xs text-slate-500 italic">No data matched or targets completed.</p>
                </div>
            </div>
        </div>

        <!-- History Flow Chart & Miss List Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-6 lg:col-span-2">
                <div id="comparisonContainer" class="h-[360px]"></div>
            </div>

            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-6 flex flex-col">
                <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Missed Target
                </h4>
                <div id="missList" class="custom-scrollbar space-y-2 flex-1 overflow-y-auto max-h-[310px] pr-1">
                    <p class="text-xs text-slate-500 italic">No items identified.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhldmarwkulkcjnrjvfk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpobGRtYXJ3a3Vsa2NqbnJqdmZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyODAzMjQsImV4cCI6MjA5MTg1NjMyNH0.AhjpHXlZSgWNlEshgc0giSSUvHV249f34424i-5g8do';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let gaugeChart, comparisonChart;
        const MONTH_ORDER = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        const parseVal = (val) => {
            if (val === null || val === undefined) return 0;
            return parseFloat(val.toString().replace(/[₱, ]/g, '')) || 0;
        };

        function animateValue(id, start, end, duration, isCurrency = true) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                
                const value = Math.round(progress * (end - start) + start);
                
                if (isCurrency) {
                    obj.innerHTML = '₱' + value.toLocaleString();
                } else {
                    obj.innerHTML = (value >= 0 ? '+' : '') + value + '%';
                    if (value > 0) {
                        obj.className = "text-2xl font-bold tracking-tight text-emerald-400";
                    } else if (value < 0) {
                        obj.className = "text-2xl font-bold tracking-tight text-rose-400";
                    } else {
                        obj.className = "text-2xl font-bold tracking-tight text-slate-100";
                    }
                }
                
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        // Retaining your highcharts setup configuration directly as original
        function initCharts() {
            gaugeChart = Highcharts.chart('gaugeContainer', {
                chart: { type: 'gauge', backgroundColor: 'transparent', margin: [0, 0, 10, 0] },
                title: null,
                pane: { startAngle: -120, endAngle: 120, background: null, center: ['50%', '85%'], size: '100%' },
                yAxis: {
                    min: 0, max: 100, lineWidth: 0, tickWidth: 0, minorTickWidth: 0, labels: { enabled: false },
                    plotBands: [{ from: 0, to: 100, color: '#e11d48', thickness: 40 }] // Default subtle rose/coral
                },
                series: [{
                    name: 'Achievement', 
                    data: [0],
                    dataLabels: {
                        enabled: true, useHTML: true, y: -25, borderWidth: 0,
                        formatter: function() {
                            const val = this.point.realValue || 0;
                            return `<div style="background:#0f172a; color:#f1f5f9; padding: 4px 12px; border-radius: 8px; font-weight:600; font-size:15px; border: 1px solid #334155; min-width: 60px; text-align: center;">${val}%</div>`;
                        }
                    },
                    dial: { radius: '90%', backgroundColor: '#94a3b8', baseWidth: 3 },
                    pivot: { backgroundColor: '#475569', radius: 5 }
                }],
                credits: { enabled: false }
            });

            comparisonChart = Highcharts.chart('comparisonContainer', {
                chart: { backgroundColor: 'transparent' },
                title: { text: 'Monthly Performance Flow', style: { color: '#cbd5e1', fontSize: '13px', fontWeight: '600' } },
                xAxis: { categories: [], labels: { style: { color: '#64748b' } }, lineWidth: 0 },
                yAxis: { title: { text: null }, gridLineColor: 'rgba(255,255,255,0.03)', labels: { style: { color: '#475569' } } },
                series: [
                    { type: 'column', name: '2026 Revenue', color: '#38bdf8', data: [] },
                    { type: 'line', name: '2026 Target', color: '#818cf8', data: [], marker: { radius: 3 } }
                ],
                credits: { enabled: false }
            });
        }

        async function refreshData() {
            const selectedMonth = document.getElementById('monthSelect').value;
            const selectedDept = document.getElementById('deptSelect').value;

            let { data: rawData } = await supabaseClient.from('revenue_targets').select('*').limit(2000);
            if (!rawData) return;

            rawData = rawData.map(d => ({...d, month: (d.month || "").trim()}));
            let deptData = selectedDept === 'ALL' ? rawData : rawData.filter(d => d.department === selectedDept);
            let metricsData = selectedMonth === 'ALL' ? deptData : deptData.filter(d => d.month === selectedMonth);

            const curRev = metricsData.filter(d => d.year == 2026).reduce((s, r) => s + parseVal(r.revenue), 0);
            const curTarget = metricsData.filter(d => d.year == 2026).reduce((s, r) => s + parseVal(r.target), 0);
            const oldRev = metricsData.filter(d => d.year == 2025).reduce((s, r) => s + parseVal(r.revenue), 0);
            
            const realAchieve = curTarget > 0 ? Math.round((curRev / curTarget) * 100) : 0;
            const growth = oldRev > 0 ? Math.round(((curRev - oldRev) / oldRev) * 100) : 0;

            animateValue('score2026', 0, curRev, 1000);
            animateValue('score2025', 0, oldRev, 1000); 
            animateValue('growthValue', 0, growth, 1000, false);
            animateValue('revText', 0, curRev, 1000);
            animateValue('targetText', 0, curTarget, 1000);

            // Replaced hot neon strings with crisp minimalist hues
            const gaugeColor = realAchieve >= 100 ? '#10b981' : '#f43f5e';
            const pointerValue = realAchieve > 100 ? 100 : realAchieve;
            
            gaugeChart.yAxis[0].update({ plotBands: [{ from: 0, to: 100, color: gaugeColor, thickness: 40 }] }, false);
            gaugeChart.series[0].points[0].update({ 
                y: pointerValue, 
                realValue: realAchieve 
            }, true, { duration: 1000 });

            const availableMonths = [...new Set(rawData.map(d => d.month))]
                .sort((a, b) => {
                    const idxA = MONTH_ORDER.findIndex(m => a.startsWith(m));
                    const idxB = MONTH_ORDER.findIndex(m => b.startsWith(m));
                    return idxA - idxB;
                });
            
            comparisonChart.update({ xAxis: { categories: availableMonths } }, false);
            
            const revList2026 = availableMonths.map(m => deptData.filter(d => d.year == 2026 && d.month == m).reduce((s, r) => s + parseVal(r.revenue), 0));
            const targetList2026 = availableMonths.map(m => deptData.filter(d => d.year == 2026 && d.month == m).reduce((s, r) => s + parseVal(r.target), 0));
            
            const dynamicColoredBars = revList2026.map((rev, idx) => {
                const targetValue = targetList2026[idx];
                return {
                    y: rev,
                    color: rev >= targetValue ? '#10b981' : '#f43f5e'
                };
            });

            comparisonChart.series[0].setData(dynamicColoredBars, false);
            comparisonChart.series[1].setData(targetList2026, true);

            const distinctDepartments = [...new Set(rawData.map(item => item.department))].sort();
            const achievedContainer = document.getElementById('hitList');
            const missedContainer = document.getElementById('missList');
            
            achievedContainer.innerHTML = '';
            missedContainer.innerHTML = '';

            let hitCounter = 0, missCounter = 0;

            distinctDepartments.forEach(dept => {
                const deptMetricsRows = metricsData.filter(row => row.department === dept && row.year == 2026);
                if (deptMetricsRows.length === 0) return;

                const totalDeptRev = deptMetricsRows.reduce((acc, row) => acc + parseVal(row.revenue), 0);
                const totalDeptTarget = deptMetricsRows.reduce((acc, row) => acc + parseVal(row.target), 0);
                const percentage = totalDeptTarget > 0 ? Math.round((totalDeptRev / totalDeptTarget) * 100) : 0;

                const deptItemElement = document.createElement('div');
                deptItemElement.className = "flex justify-between items-center bg-slate-900/30 border border-slate-800/50 p-2.5 rounded-lg text-xs font-medium text-slate-300";
                
                if (totalDeptRev >= totalDeptTarget) {
                    deptItemElement.innerHTML = `
                        <span class="flex items-center gap-2 truncate">
                            <span class="text-[10px] text-emerald-400 font-bold">✓</span> 
                            <span class="truncate">${dept}</span>
                        </span>
                        <span class="font-semibold text-emerald-400 ml-2">${percentage}%</span>`;
                    achievedContainer.appendChild(deptItemElement);
                    hitCounter++;
                } else {
                    deptItemElement.innerHTML = `
                        <span class="flex items-center gap-2 truncate">
                            <span class="text-[10px] text-rose-400 font-bold">✕</span> 
                            <span class="truncate">${dept}</span>
                        </span>
                        <span class="font-semibold text-rose-400 ml-2">${percentage}%</span>`;
                    missedContainer.appendChild(deptItemElement);
                    missCounter++;
                }
            });

            if(hitCounter === 0) achievedContainer.innerHTML = '<p class="text-xs text-slate-600 italic p-2">No departments achieved quota.</p>';
            if(missCounter === 0) missedContainer.innerHTML = '<p class="text-xs text-slate-600 italic p-2">All departments hit targets!</p>';
        }

        window.onload = async () => {
            initCharts();
            const { data } = await supabaseClient.from('revenue_targets').select('department, month').limit(2000);
            if (!data) return;

            const uniqueDepts = [...new Set(data.map(item => item.department))].sort();
            uniqueDepts.forEach(dept => {
                const opt = document.createElement('option');
                opt.value = dept; opt.innerHTML = dept; opt.className = "bg-slate-950";
                document.getElementById('deptSelect').appendChild(opt);
            });

            const uniqueMonths = [...new Set(data.map(item => (item.month || "").trim()))]
                .sort((a, b) => {
                    const idxA = MONTH_ORDER.findIndex(m => a.startsWith(m));
                    const idxB = MONTH_ORDER.findIndex(m => b.startsWith(m));
                    return idxA - idxB;
                });
            uniqueMonths.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.innerHTML = m; opt.className = "bg-slate-950";
                document.getElementById('monthSelect').appendChild(opt);
            });

            document.getElementById('monthSelect').addEventListener('change', refreshData);
            document.getElementById('deptSelect').addEventListener('change', refreshData);
            
            setTimeout(refreshData, 100);
        };
    </script>
</body>
</html>
