    <script>
        const SUPABASE_URL = 'https://jhldmarwkulkcjnrjvfk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpobGRtYXJ3a3Vsa2NqbnJqdmZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyODAzMjQsImV4cCI6MjA5MTg1NjMyNH0.AhjpHXlZSgWNlEshgc0giSSUvHV249f34424i-5g8do';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let gaugeChart, comparisonChart, growthStreamChart;
        let activeAnimationId = null; 
        const MONTH_ORDER = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const maxYear = 2026; 

        const parseVal = (val) => {
            if (val === null || val === undefined) return 0;
            return parseFloat(val.toString().replace(/[₱, ]/g, '')) || 0;
        };

        function toggle2024Data() {
            const panel = document.getElementById('hidden2024Panel');
            const arrow = document.getElementById('toggleTriangle');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                panel.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function drawSpark(canvasId, metricArray) {
            const canvas = document.getElementById('trendSparkline');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            if (activeAnimationId) cancelAnimationFrame(activeAnimationId);

            const width = canvas.width = canvas.parentElement.clientWidth;
            const height = canvas.height = 45;
            
            const val24 = metricArray[0] || 0;
            const val25 = metricArray[1] || 0;
            const val26 = metricArray[2] || 0;

            const minVal = Math.min(val24, val25, val26);
            const maxVal = Math.max(val24, val25, val26);
            const range = (maxVal - minVal) === 0 ? 1 : (maxVal - minVal);

            const p1 = { x: 8,             y: height - 6 - ((val24 - minVal) / range) * (height - 12) };
            const p2 = { x: width / 2,     y: height - 6 - ((val25 - minVal) / range) * (height - 12) };
            const p3 = { x: width - 8,     y: height - 6 - ((val26 - minVal) / range) * (height - 12) };

            let progress = 0;
            const speed = 0.03; 
            const lineColor = val26 >= val25 ? '#10b981' : '#f43f5e';

            function getStraightLineXY(t) {
                if (t <= 0.5) {
                    return { x: p1.x + (p2.x - p1.x) * (t * 2), y: p1.y + (p2.y - p1.y) * (t * 2) };
                } else {
                    return { x: p2.x + (p3.x - p2.x) * ((t - 0.5) * 2), y: p2.y + (p3.y - p2.y) * ((t - 0.5) * 2) };
                }
            }

            function animate() {
                progress += speed;
                if (progress > 1) progress = 1;

                ctx.clearRect(0, 0, width, height);

                ctx.fillStyle = '#4b5563';
                [p1, p2, p3].forEach(p => {
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 2 * Math.PI); ctx.fill();
                });

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                
                const stepCount = Math.floor(progress * 30);
                for (let i = 0; i <= stepCount; i++) {
                    const currentXY = getStraightLineXY((i / 30) * progress);
                    ctx.lineTo(currentXY.x, currentXY.y);
                }
                const tailXY = getStraightLineXY(progress);
                ctx.lineTo(tailXY.x, tailXY.y);

                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 2;
                ctx.lineJoin = 'miter';
                ctx.stroke();

                if (progress < 1) {
                    activeAnimationId = requestAnimationFrame(animate);
                }
            }
            animate();
        }

        function animateValue(id, start, end, duration, isCurrency = true) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const value = Math.round(progress * (end - start) + start);
                obj.innerHTML = isCurrency ? '₱' + value.toLocaleString() : value + '%';
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function initCharts() {
            gaugeChart = Highcharts.chart('gaugeContainer', {
                chart: { type: 'gauge', backgroundColor: 'transparent', margin: [0, 0, 10, 0] },
                title: null,
                pane: { startAngle: -120, endAngle: 120, background: null, center: ['50%', '85%'], size: '100%' },
                yAxis: {
                    min: 0, max: 100, lineWidth: 0, tickWidth: 0, minorTickWidth: 0, labels: { enabled: false },
                    plotBands: [{ from: 0, to: 100, color: '#f43f5e', thickness: 40 }]
                },
                series: [{
                    name: 'Achievement', data: [0],
                    dataLabels: {
                        enabled: true, useHTML: true, y: -25, borderWidth: 0,
                        formatter: function() {
                            return `<div style="background:#030712; color:#f3f4f6; padding: 4px 14px; border-radius: 8px; font-weight:800; font-size:16px; border: 1px solid #374151; min-width: 65px; text-align: center;">${this.point.realValue || 0}%</div>`;
                        }
                    },
                    dial: { radius: '90%', backgroundColor: '#9ca3af', baseWidth: 3 },
                    pivot: { backgroundColor: '#4b5563', radius: 5 }
                }],
                credits: { enabled: false }
            });

            comparisonChart = Highcharts.chart('comparisonContainer', {
                chart: { backgroundColor: 'transparent' },
                title: { text: 'Monthly Performance Flow', style: { color: '#9ca3af', fontSize: '13px', fontWeight: '700', letterSpacing: '0.05em' } },
                xAxis: { categories: [], labels: { style: { color: '#6b7280', fontWeight: '600' } }, lineWidth: 0 },
                yAxis: { title: { text: null }, gridLineColor: 'rgba(255,255,255,0.03)', labels: { style: { color: '#4b5563' } } },
                series: [
                    { 
                        type: 'column', name: '2026 Revenue', color: '#0ea5e9', data: [],
                        dataLabels: {
                            enabled: true, inside: false, useHTML: true,
                            formatter: function() {
                                const pct = this.point.attainmentPct; if (pct === undefined) return '';
                                const txtColor = pct >= 100 ? '#228b22' : '#f43f5e';
                                let yShift = this.point.y < this.point.monthTarget ? Math.min(Math.round(((this.point.monthTarget - this.point.y) / this.point.monthTarget) * 210) + 16, 180) : 16;
                                return `<span style="color: ${txtColor}; font-weight:800; font-size:11px; display:block; transform:translateY(-${yShift}px); background:#030712; padding:1px 4px; border-radius:4px;">${pct}%</span>`;
                            }
                        }
                    },
                    { type: 'line', name: '2026 Target', color: '#a855f7', data: [], marker: { radius: 3.5 } }
                ],
                credits: { enabled: false }
            });

            growthStreamChart = Highcharts.chart('growthStreamContainer', {
                chart: { backgroundColor: 'transparent' },
                title: { text: 'Year-over-Year (YoY) Growth Analytics Stream', style: { color: '#9ca3af', fontSize: '13px', fontWeight: '700', letterSpacing: '0.05em' } },
                xAxis: { categories: [], labels: { style: { color: '#6b7280', fontWeight: '600' } }, lineWidth: 0 },
                yAxis: [{ title: { text: null }, gridLineColor: 'rgba(255,255,255,0.02)', labels: { style: { color: '#4b5563' } } }, { title: { text: null }, opposite: true, gridLineWidth: 0, labels: { formatter: function() { return this.value + '%'; }, style: { color: '#f59e0b', fontWeight: '700' } } }],
                tooltip: { shared: true },
                series: [
                    { type: 'spline', name: '2025 Revenue', color: '#4b5563', dashStyle: 'ShortDash', data: [], marker: { radius: 3 } },
                    { type: 'areaspline', name: '2026 Revenue', color: { linearGradient: { x1: 0, y1: 0, x2: 0, y2: 1 }, stops: [[0, 'rgba(16, 185, 129, 0.25)'], [1, 'rgba(16, 185, 129, 0.0)']] }, lineColor: '#10b981', lineWidth: 3, data: [], marker: { radius: 4, fillColor: '#030712', lineWidth: 2, lineColor: '#10b981' } },
                    {
                        type: 'line', name: 'Growth Rate', color: '#f59e0b', yAxis: 1, data: [], marker: { enabled: false }, lineWidth: 1.5, dashStyle: 'Dot',
                        dataLabels: { enabled: true, useHTML: true, formatter: function() { return `<span style="color:${this.y >= 0 ? '#228b22' : '#f43f5e'}; font-weight:800; font-size:10px; background:#090d16; padding:1px 3px; border-radius:3px;">${this.y >= 0 ? '+' : ''}${this.y}%</span>`; } }
                    }
                ],
                credits: { enabled: false }
            });
        }

        async function refreshData() {
            const selectedMonth = document.getElementById('monthSelect').value;
            const selectedDept = document.getElementById('deptSelect').value;

            let { data: rawData } = await supabaseClient.from('revenue_targets').select('*').limit(2000);
            if (!rawData) return;

            rawData = rawData.map(d => ({...d, month: (d.month || "").trim()}));
            let deptData = selectedDept === 'ALL' ? rawData : rawData.filter(d => d.department === selectedDept);

            const monthsWith2026Data = [...new Set(deptData.filter(d => d.year == 2026 && parseVal(d.revenue) > 0).map(d => d.month))];
            const activeIndices = monthsWith2026Data.map(m => MONTH_ORDER.findIndex(mo => m.startsWith(mo))).filter(idx => idx !== -1);
            const max2026MonthIndex = activeIndices.length > 0 ? Math.max(...activeIndices) : -1;
            const validComparisonMonths = max2026MonthIndex !== -1 ? MONTH_ORDER.slice(0, max2026MonthIndex + 1) : [];

            document.getElementById('applesToApplesBadge').innerHTML = selectedMonth !== 'ALL' ? selectedMonth : (validComparisonMonths.length > 0 ? `YTD (Jan-${validComparisonMonths[validComparisonMonths.length - 1]})` : "No Data");

            let metricsData = selectedMonth === 'ALL' ? deptData : deptData.filter(d => d.month === selectedMonth);

            const curRev = metricsData.filter(d => d.year == 2026).reduce((s, r) => s + parseVal(r.revenue), 0);
            const curTarget = metricsData.filter(d => d.year == 2026).reduce((s, r) => s + parseVal(r.target), 0);
            
            let oldRev = 0, oldRev2024 = 0;
            if (selectedMonth !== 'ALL') {
                oldRev = metricsData.filter(d => d.year == 2025).reduce((s, r) => s + parseVal(r.revenue), 0);
                oldRev2024 = metricsData.filter(d => d.year == 2024).reduce((s, r) => s + parseVal(r.revenue), 0);
            } else {
                oldRev = deptData.filter(d => d.year == 2025 && validComparisonMonths.some(vm => d.month.startsWith(vm))).reduce((s, r) => s + parseVal(r.revenue), 0);
                oldRev2024 = deptData.filter(d => d.year == 2024 && validComparisonMonths.some(vm => d.month.startsWith(vm))).reduce((s, r) => s + parseVal(r.revenue), 0);
            }
            
            const realAchieve = curTarget > 0 ? Math.round((curRev / curTarget) * 100) : 0;
            const growth = oldRev > 0 ? Math.round(((curRev - oldRev) / oldRev) * 100) : 0;

            animateValue('score2026', 0, curRev, 1000);
            animateValue('score2025', 0, oldRev, 1000); 
            animateValue('score2024', 0, oldRev2024, 1000);
            animateValue('growthValue', 0, growth, 1000, false);
            animateValue('revText', 0, curRev, 1000);
            animateValue('targetText', 0, curTarget, 1000);

            const arrowEl = document.getElementById('growthArrow');
            if (arrowEl) { arrowEl.innerHTML = growth >= 0 ? "▲" : "▼"; arrowEl.className = growth >= 0 ? "text-sm font-black text-[#228b22]" : "text-sm font-black text-[#f43f5e]"; }

            const years = [maxYear - 2, maxYear - 1, maxYear];
            const stats = [ { r: oldRev2024 }, { r: oldRev }, { r: curRev } ];
            
            drawSpark('sparkLineChart', stats.map(s => s.r));
            document.getElementById('sparkLabels').innerHTML = years.map(y => `<span>${y}</span>`).join('');

            const varianceEl = document.getElementById('varianceText');
            if (varianceEl) {
                if (curTarget === 0) { varianceEl.innerHTML = "0%"; varianceEl.className = "text-xs font-black text-white"; }
                else if (curRev >= curTarget) { varianceEl.innerHTML = `Surplus +${Math.round(((curRev - curTarget) / curTarget) * 100)}%`; varianceEl.className = "text-xs font-black text-[#228b22]"; }
                else { varianceEl.innerHTML = `Deficit -${Math.round(((curTarget - curRev) / curTarget) * 100)}%`; varianceEl.className = "text-xs font-black text-[#f43f5e]"; }
            }

            let gaugeColor = realAchieve >= 100 ? '#228b22' : '#f43f5e';
            document.getElementById('revText').className = `text-xl sm:text-2xl font-extrabold ${realAchieve >= 100 ? 'text-[#228b22]' : 'text-[#f43f5e]'}`;

            gaugeChart.yAxis[0].update({ plotBands: [{ from: 0, to: 100, color: gaugeColor, thickness: 40 }] }, false);
            gaugeChart.series[0].points[0].update({ y: realAchieve > 100 ? 100 : realAchieve, realValue: realAchieve }, true, { duration: 1000 });

            const dynamicChartCategories = [...new Set(rawData.map(d => d.month))].sort((a, b) => MONTH_ORDER.findIndex(m => a.startsWith(m)) - MONTH_ORDER.findIndex(m => b.startsWith(m))).filter(m => {
                if (selectedMonth !== 'ALL') return m === selectedMonth;
                const checkIdx = MONTH_ORDER.findIndex(mo => m.startsWith(mo));
                return checkIdx !== -1 && checkIdx <= max2026MonthIndex;
            });
            
            comparisonChart.update({ xAxis: { categories: dynamicChartCategories } }, false);
            growthStreamChart.update({ xAxis: { categories: dynamicChartCategories } }, false);
            
            const revList2026 = dynamicChartCategories.map(m => deptData.filter(d => d.year == 2026 && d.month == m).reduce((s, r) => s + parseVal(r.revenue), 0));
            const targetList2026 = dynamicChartCategories.map(m => deptData.filter(d => d.year == 2026 && d.month == m).reduce((s, r) => s + parseVal(r.target), 0));
            const revList2025 = dynamicChartCategories.map(m => deptData.filter(d => d.year == 2025 && d.month == m).reduce((s, r) => s + parseVal(r.revenue), 0));
            const monthlyGrowthRates = revList2026.map((rev26, idx) => revList2025[idx] > 0 ? Math.round(((rev26 - revList2025[idx]) / revList2025[idx]) * 100) : 0);
            
            comparisonChart.series[0].setData(revList2026.map((rev, idx) => ({ y: rev, color: rev >= targetList2026[idx] ? '#228b22' : '#f43f5e', attainmentPct: targetList2026[idx] > 0 ? Math.round((rev / targetList2026[idx]) * 100) : 0, monthTarget: targetList2026[idx] })), false);
            comparisonChart.series[1].setData(targetList2026, true);

            growthStreamChart.series[0].setData(revList2025, false);
            growthStreamChart.series[1].setData(revList2026, false);
            growthStreamChart.series[2].setData(monthlyGrowthRates, true);

            const distinctDepartments = [...new Set(rawData.map(item => item.department))].sort();
            const achievedContainer = document.getElementById('hitList'); const missedContainer = document.getElementById('missList');
            achievedContainer.innerHTML = ''; missedContainer.innerHTML = '';
            let hitCounter = 0, missCounter = 0;

            distinctDepartments.forEach(dept => {
                const deptMetricsRows = metricsData.filter(row => row.department === dept && row.year == 2026); if (deptMetricsRows.length === 0) return;
                const totalDeptRev = deptMetricsRows.reduce((acc, row) => acc + parseVal(row.revenue), 0);
                const totalDeptTarget = deptMetricsRows.reduce((acc, row) => acc + parseVal(row.target), 0);
                const percentage = totalDeptTarget > 0 ? Math.round((totalDeptRev / totalDeptTarget) * 100) : 0;

                const deptItemElement = document.createElement('div'); deptItemElement.className = "flex justify-between items-center bg-gray-900/30 border border-gray-800/60 p-2.5 rounded-xl text-xs font-semibold text-gray-300";
                if (totalDeptRev >= totalDeptTarget) {
                    deptItemElement.innerHTML = `<span class="flex items-center gap-2 truncate"><span class="text-emerald-400 text-[10px]">✓</span><span class="truncate text-gray-200">${dept}</span></span><span class="font-bold text-emerald-400 ml-2">${percentage}%</span>`;
                    achievedContainer.appendChild(deptItemElement); hitCounter++;
                } else {
                    deptItemElement.innerHTML = `<span class="flex items-center gap-2 truncate"><span class="text-rose-500 text-[10px]">✕</span><span class="truncate text-gray-400">${dept}</span></span><span class="font-bold text-rose-400 ml-2">${percentage}%</span>`;
                    missedContainer.appendChild(deptItemElement); missCounter++;
                }
            });

            if(hitCounter === 0) achievedContainer.innerHTML = '<p class="text-xs text-gray-600 italic p-2">No departments achieved quota.</p>';
            if(missCounter === 0) missedContainer.innerHTML = '<p class="text-xs text-gray-600 italic p-2">All departments hit targets!</p>';
        }

        window.onload = async () => {
            initCharts();
            const { data } = await supabaseClient.from('revenue_targets').select('department, month, year, revenue').limit(2000);
            if (!data) return;

            [...new Set(data.map(item => item.department))].sort().forEach(dept => {
                const opt = document.createElement('option'); opt.value = dept; opt.innerHTML = dept; document.getElementById('deptSelect').appendChild(opt);
            });

            [...new Set(data.filter(d => d.year == 2026 && parseVal(d.revenue) > 0).map(item => (item.month || "").trim()))].sort((a, b) => MONTH_ORDER.findIndex(m => a.startsWith(m)) - MONTH_ORDER.findIndex(m => b.startsWith(m))).forEach(m => {
                const opt = document.createElement('option'); opt.value = m; opt.innerHTML = m; document.getElementById('monthSelect').appendChild(opt);
            });

            document.getElementById('monthSelect').addEventListener('change', refreshData);
            document.getElementById('deptSelect').addEventListener('change', refreshData);
            setTimeout(refreshData, 100);
        };
    </script>
</body>
</html>
