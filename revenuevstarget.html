<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Revenue Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.highcharts.com/11.4.0/highcharts.js"></script>
    <script src="https://code.highcharts.com/11.4.0/highcharts-more.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #030712; 
            color: #f3f4f6; 
        }
        
        /* Distinct Neon Border Utilities */
        .neon-emerald { border: 1px solid rgba(16, 185, 129, 0.2); box-shadow: 0 0 15px rgba(16, 185, 129, 0.1); }
        .neon-indigo { border: 1px solid rgba(99, 102, 241, 0.2); box-shadow: 0 0 15px rgba(99, 102, 241, 0.1); }
        .neon-amber { border: 1px solid rgba(245, 158, 11, 0.2); box-shadow: 0 0 15px rgba(245, 158, 11, 0.1); }
        .neon-purple { border: 1px solid rgba(168, 85, 247, 0.2); box-shadow: 0 0 15px rgba(168, 85, 247, 0.1); }
        .neon-blue { border: 1px solid rgba(59, 130, 246, 0.2); box-shadow: 0 0 15px rgba(59, 130, 246, 0.1); }
        .neon-rose { border: 1px solid rgba(244, 63, 94, 0.2); box-shadow: 0 0 15px rgba(244, 63, 94, 0.1); }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Navbar -->
    <nav class="border-b border-gray-800 bg-gray-950/70 backdrop-blur-md sticky top-0 z-50 px-8 py-4 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="website.html" class="flex items-center space-x-2 text-gray-400 hover:text-emerald-400 transition-colors group">
                    <svg class="w-5 h-5 group-hover:scale-105 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"></path>
                    </svg>
                    <span class="text-xs font-bold tracking-wider uppercase">Home</span>
                </a>
                <div class="h-4 w-[1px] bg-gray-800"></div>
                <h1 class="text-xs font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-indigo-400 uppercase">KPI Department Revenue & Target</h1>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 space-y-6">
        
        <!-- Controls Section -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-gray-900/60 border border-gray-800 rounded-xl px-4 py-2">
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider">Timeline</label>
                <select id="monthSelect" class="w-full bg-transparent text-sm font-bold text-gray-200 outline-none cursor-pointer py-0.5">
                    <option class="bg-gray-950" value="ALL">Year-to-Date (All Months)</option>
                </select>
            </div>
            <div class="bg-gray-900/60 border border-gray-800 rounded-xl px-4 py-2">
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider">Scope</label>
                <select id="deptSelect" class="w-full bg-transparent text-sm font-bold text-gray-200 outline-none cursor-pointer py-0.5">
                    <option class="bg-gray-950" value="ALL">Consolidated Hospital</option>
                </select>
            </div>
        </div>

        <!-- Metric KPI Board -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-950 neon-emerald rounded-2xl p-6 transition-all duration-300 hover:scale-[1.01]">
                <p class="text-[10px] font-bold text-emerald-500/80 uppercase tracking-widest mb-1">2026 Actual Revenue</p>
                <h3 id="score2026" class="text-3xl font-extrabold tracking-tight text-[#228b22]">₱0</h3>
            </div>
            <div class="bg-gray-950 neon-indigo rounded-2xl p-6 transition-all duration-300 hover:scale-[1.01]">
                <p class="text-[10px] font-bold text-indigo-400/80 uppercase tracking-widest mb-1">2025 Actual Revenue</p>
                <h3 id="score2025" class="text-3xl font-extrabold tracking-tight text-white">₱0</h3>
            </div>
            <div id="growthCard" class="bg-gray-950 neon-amber rounded-2xl p-6 transition-all duration-300 hover:scale-[1.01] flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-bold text-amber-500/80 uppercase tracking-widest mb-1">YoY Growth</p>
                    <h3 id="growthValue" class="text-3xl font-extrabold tracking-tight text-white">0%</h3>
                </div>
                <!-- HTML5 Hardware-Accelerated Curved Dynamic Sparkline with Arrowhead -->
                <div class="relative w-36 h-14 flex items-center justify-end">
                    <canvas id="runningSparkline" width="130" height="50" class="w-[130px] h-[50px]"></canvas>
                </div>
            </div>
        </div>

        <!-- Gauge and Target Listing -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-gray-950 neon-purple rounded-2xl p-6 flex flex-col justify-between">
                <div class="flex items-center justify-between gap-4 w-full border-b border-gray-900 pb-4 mb-4">
                    <div>
                        <p class="text-[10px] font-bold text-purple-400 uppercase tracking-wider mb-0.5">Current Revenue</p>
                        <p id="revText" class="text-2xl font-extrabold transition-colors duration-300">₱0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Target Quota</p>
                        <p id="targetText" class="text-2xl font-extrabold text-white">₱0</p>
                    </div>
                </div>
                <div class="w-full h-[240px]">
                    <div id="gaugeContainer" class="w-full h-full"></div>
                </div>
            </div>

            <div class="bg-gray-950 neon-blue rounded-2xl p-6 flex flex-col">
                <h4 class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Achieved Target
                </h4>
                <div id="hitList" class="custom-scrollbar space-y-2 flex-1 overflow-y-auto max-h-[290px] pr-1">
                    <p class="text-xs text-gray-500 italic">No data matched or targets completed.</p>
                </div>
            </div>
        </div>

        <!-- Historical Stream & Deficit Board -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-gray-950 neon-blue lg:col-span-2 rounded-2xl p-6">
                <div id="comparisonContainer" class="h-[360px]"></div>
            </div>

            <div class="bg-gray-950 neon-rose rounded-2xl p-6 flex flex-col">
                <h4 class="text-xs font-bold text-rose-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span> Missed Target
                </h4>
                <div id="missList" class="custom-scrollbar space-y-2 flex-1 overflow-y-auto max-h-[310px] pr-1">
                    <p class="text-xs text-gray-500 italic">No items identified.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhldmarwkulkcjnrjvfk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpobGRtYXJ3a3Vsa2NqbnJqdmZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyODAzMjQsImV4cCI6MjA5MTg1NjMyNH0.AhjpHXlZSgWNlEshgc0giSSUvHV249f34424i-5g8do';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let gaugeChart, comparisonChart;
        let activeAnimationId = null; 
        const MONTH_ORDER = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        const parseVal = (val) => {
            if (val === null || val === undefined) return 0;
            return parseFloat(val.toString().replace(/[₱, ]/g, '')) || 0;
        };

        // Canvas Engine creating animated smooth cubic Bezier curve vectors
        function drawRunningSparkline(isGoingUp) {
            const canvas = document.getElementById('runningSparkline');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            if (activeAnimationId) {
                cancelAnimationFrame(activeAnimationId);
            }

            const width = canvas.width;
            const height = canvas.height;
            
            let progress = 0;
            const speed = 0.03; // Smooth animation window timing
            
            // Layout dimensions matching boundaries safely
            const startX = 6;
            const startY = isGoingUp ? height - 8 : 8;
            const endX = width - 12; // Reserves space so arrowhead stays within canvas boundaries
            const endY = isGoingUp ? 8 : height - 8;

            // Generate control points to simulate natural financial trend waves
            const cp1x = startX + (endX - startX) * 0.4;
            const cp1y = startY;
            const cp2x = startX + (endX - startX) * 0.6;
            const cp2y = endY;

            const lineColor = isGoingUp ? '#228b22' : '#f43f5e';
            const glowColor = isGoingUp ? 'rgba(34, 139, 34, 0.35)' : 'rgba(244, 63, 94, 0.35)';

            // Calculates specific properties on a cubic Bezier curve at a given time progress interval (t)
            function getBezierXY(t) {
                const mt = 1 - t;
                const x = mt*mt*mt*startX + 3*mt*mt*t*cp1x + 3*mt*t*t*cp2x + t*t*t*endX;
                const y = mt*mt*mt*startY + 3*mt*mt*t*cp1y + 3*mt*t*t*cp2y + t*t*t*endY;
                return { x, y };
            }

            // Calculates the precise slope angle at progress window slice (t)
            function getBezierAngle(t) {
                const mt = 1 - t;
                const dx = 3*mt*mt*(cp1x - startX) + 6*mt*t*(cp2x - cp1x) + 3*t*t*(endX - cp2x);
                const dy = 3*mt*mt*(cp1y - startY) + 6*mt*t*(cp2y - cp1y) + 3*t*t*(endY - cp2y);
                return Math.atan2(dy, dx);
            }

            function animate() {
                progress += speed;
                if (progress > 1) progress = 1;

                ctx.clearRect(0, 0, width, height);

                // Build modern multi-segment path sequence up to active point
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                
                // Segment subdivision execution across frames
                const steps = Math.floor(progress * 40);
                for (let i = 0; i <= steps; i++) {
                    const t = (i / 40) * progress;
                    const pt = getBezierXY(t);
                    ctx.lineTo(pt.x, pt.y);
                }

                const currentPt = getBezierXY(progress);
                ctx.lineTo(currentPt.x, currentPt.y);

                // Render glowing shadow underlay trace
                ctx.strokeStyle = glowColor;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Render pristine solid foreground curve indicator core
                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 3;
                ctx.stroke();

                // Draw solid pointer arrowhead alignment geometry matching terminal velocity slope
                const angle = getBezierAngle(progress);
                ctx.save();
                ctx.translate(currentPt.x, currentPt.y);
                ctx.rotate(angle);
                
                ctx.beginPath();
                ctx.moveTo(2, 0);
                ctx.lineTo(-6, -5);
                ctx.lineTo(-6, 5);
                ctx.closePath();
                
                ctx.fillStyle = lineColor;
                ctx.fill();
                ctx.restore();

                if (progress < 1) {
                    activeAnimationId = requestAnimationFrame(animate);
                }
            }
            animate();
        }

        function animateValue(id, start, end, duration, isCurrency = true) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                
                const value = Math.round(progress * (end - start) + start);
                
                if (isCurrency) {
                    if (id === 'score2026') {
                        obj.innerHTML = '₱' + value.toLocaleString();
                        obj.className = "text-3xl font-extrabold tracking-tight text-[#228b22]";
                    } else if (id === 'score2025') {
                        obj.innerHTML = '₱' + value.toLocaleString();
                        obj.className = "text-3xl font-extrabold tracking-tight text-white";
                    } else if (id === 'targetText') {
                        obj.innerHTML = '₱' + value.toLocaleString();
                        obj.className = "text-2xl font-extrabold text-white";
                    } else if (id === 'revText') {
                        obj.innerHTML = '₱' + value.toLocaleString();
                    } else {
                        obj.innerHTML = '₱' + value.toLocaleString();
                    }
                } else {
                    obj.innerHTML = (value >= 0 ? '+' : '') + value + '%';
                    const cardEl = document.getElementById('growthCard');

                    if (value >= 0) {
                        obj.className = "text-3xl font-extrabold tracking-tight text-[#228b22]";
                        if(cardEl) cardEl.className = "bg-gray-950 neon-emerald rounded-2xl p-6 transition-all duration-300 hover:scale-[1.01] flex justify-between items-center";
                    } else {
                        obj.className = "text-3xl font-extrabold tracking-tight text-[#f43f5e]";
                        if(cardEl) cardEl.className = "bg-gray-950 neon-rose rounded-2xl p-6 transition-all duration-300 hover:scale-[1.01] flex justify-between items-center";
                    }
                }
                
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function initCharts() {
            gaugeChart = Highcharts.chart('gaugeContainer', {
                chart: { type: 'gauge', backgroundColor: 'transparent', margin: [0, 0, 10, 0] },
                title: null,
                pane: { startAngle: -120, endAngle: 120, background: null, center: ['50%', '85%'], size: '100%' },
                yAxis: {
                    min: 0, max: 100, lineWidth: 0, tickWidth: 0, minorTickWidth: 0, labels: { enabled: false },
                    plotBands: [{ from: 0, to: 100, color: '#f43f5e', thickness: 40 }]
                },
                series: [{
                    name: 'Achievement', 
                    data: [0],
                    dataLabels: {
                        enabled: true, useHTML: true, y: -25, borderWidth: 0,
                        formatter: function() {
                            const val = this.point.realValue || 0;
                            return `<div style="background:#030712; color:#f3f4f6; padding: 4px 14px; border-radius: 8px; font-weight:800; font-size:16px; border: 1px solid #374151; min-width: 65px; text-align: center;">${val}%</div>`;
                        }
                    },
                    dial: { radius: '90%', backgroundColor: '#9ca3af', baseWidth: 3 },
                    pivot: { backgroundColor: '#4b5563', radius: 5 }
                }],
                credits: { enabled: false }
            });

            comparisonChart = Highcharts.chart('comparisonContainer', {
                chart: { backgroundColor: 'transparent' },
                title: { text: 'Monthly Performance Flow', style: { color: '#9ca3af', fontSize: '13px', fontWeight: '700', letterSpacing: '0.05em' } },
                xAxis: { categories: [], labels: { style: { color: '#6b7280', fontWeight: '600' } }, lineWidth: 0 },
                yAxis: { title: { text: null }, gridLineColor: 'rgba(255,255,255,0.03)', labels: { style: { color: '#4b5563' } } },
                series: [
                    { type: 'column', name: '2026 Revenue', color: '#0ea5e9', data: [] },
                    { type: 'line', name: '2026 Target', color: '#a855f7', data: [], marker: { radius: 3.5 } }
                ],
                credits: { enabled: false }
            });
        }

        async function refreshData() {
            const selectedMonth = document.getElementById('monthSelect').value;
            const selectedDept = document.getElementById('deptSelect').value;

            let { data: rawData } = await supabaseClient.from('revenue_targets').select('*').limit(2000);
            if (!rawData) return;

            rawData = rawData.map(d => ({...d, month: (d.month || "").trim()}));
            let deptData = selectedDept === 'ALL' ? rawData : rawData.filter(d => d.department === selectedDept);
            let metricsData = selectedMonth === 'ALL' ? deptData : deptData.filter(d => d.month === selectedMonth);

            const curRev = metricsData.filter(d => d.year == 2026).reduce((s, r) => s + parseVal(r.revenue), 0);
            const curTarget = metricsData.filter(d => d.year == 2026).reduce((s, r) => s + parseVal(r.target), 0);
            const oldRev = metricsData.filter(d => d.year == 2025).reduce((s, r) => s + parseVal(r.revenue), 0);
            
            const realAchieve = curTarget > 0 ? Math.round((curRev / curTarget) * 100) : 0;
            const growth = oldRev > 0 ? Math.round(((curRev - oldRev) / oldRev) * 100) : 0;

            animateValue('score2026', 0, curRev, 1000);
            animateValue('score2025', 0, oldRev, 1000); 
            animateValue('growthValue', 0, growth, 1000, false);
            animateValue('revText', 0, curRev, 1000);
            animateValue('targetText', 0, curTarget, 1000);

            // Trigger canvas directional curved vectors
            drawRunningSparkline(growth >= 0);

            // Dynamic Changing Colors logic for Gauge Headers
            const revTextEl = document.getElementById('revText');
            let gaugeColor = '#f43f5e';
            
            if (realAchieve >= 100) {
                gaugeColor = '#228b22';
                if (revTextEl) revTextEl.className = "text-2xl font-extrabold text-[#228b22]";
            } else {
                if (revTextEl) revTextEl.className = "text-2xl font-extrabold text-[#f43f5e]";
            }

            const pointerValue = realAchieve > 100 ? 100 : realAchieve;
            
            gaugeChart.yAxis[0].update({ plotBands: [{ from: 0, to: 100, color: gaugeColor, thickness: 40 }] }, false);
            gaugeChart.series[0].points[0].update({ 
                y: pointerValue, 
                realValue: realAchieve 
            }, true, { duration: 1000 });

            const availableMonths = [...new Set(rawData.map(d => d.month))]
                .sort((a, b) => {
                    const idxA = MONTH_ORDER.findIndex(m => a.startsWith(m));
                    const idxB = MONTH_ORDER.findIndex(m => b.startsWith(m));
                    return idxA - idxB;
                });
            
            comparisonChart.update({ xAxis: { categories: availableMonths } }, false);
            
            const revList2026 = availableMonths.map(m => deptData.filter(d => d.year == 2026 && d.month == m).reduce((s, r) => s + parseVal(r.revenue), 0));
            const targetList2026 = availableMonths.map(m => deptData.filter(d => d.year == 2026 && d.month == m).reduce((s, r) => s + parseVal(r.target), 0));
            
            const dynamicColoredBars = revList2026.map((rev, idx) => {
                const targetValue = targetList2026[idx];
                return {
                    y: rev,
                    color: rev >= targetValue ? '#228b22' : '#f43f5e'
                };
            });

            comparisonChart.series[0].setData(dynamicColoredBars, false);
            comparisonChart.series[1].setData(targetList2026, true);

            const distinctDepartments = [...new Set(rawData.map(item => item.department))].sort();
            const achievedContainer = document.getElementById('hitList');
            const missedContainer = document.getElementById('missList');
            
            achievedContainer.innerHTML = '';
            missedContainer.innerHTML = '';

            let hitCounter = 0, missCounter = 0;

            distinctDepartments.forEach(dept => {
                const deptMetricsRows = metricsData.filter(row => row.department === dept && row.year == 2026);
                if (deptMetricsRows.length === 0) return;

                const totalDeptRev = deptMetricsRows.reduce((acc, row) => acc + parseVal(row.revenue), 0);
                const totalDeptTarget = deptMetricsRows.reduce((acc, row) => acc + parseVal(row.target), 0);
                const percentage = totalDeptTarget > 0 ? Math.round((totalDeptRev / totalDeptTarget) * 100) : 0;

                const deptItemElement = document.createElement('div');
                deptItemElement.className = "flex justify-between items-center bg-gray-900/30 border border-gray-800/60 p-2.5 rounded-xl text-xs font-semibold text-gray-300";
                
                if (totalDeptRev >= totalDeptTarget) {
                    deptItemElement.innerHTML = `
                        <span class="flex items-center gap-2 truncate">
                            <span class="text-emerald-400 text-[10px]">✓</span> 
                            <span class="truncate text-gray-200">${dept}</span>
                        </span>
                        <span class="font-bold text-emerald-400 ml-2">${percentage}%</span>`;
                    achievedContainer.appendChild(deptItemElement);
                    hitCounter++;
                } else {
                    deptItemElement.innerHTML = `
                        <span class="flex items-center gap-2 truncate">
                            <span class="text-rose-500 text-[10px]">✕</span> 
                            <span class="truncate text-gray-400">${dept}</span>
                        </span>
                        <span class="font-bold text-rose-400 ml-2">${percentage}%</span>`;
                    missedContainer.appendChild(deptItemElement);
                    missCounter++;
                }
            });

            if(hitCounter === 0) achievedContainer.innerHTML = '<p class="text-xs text-gray-600 italic p-2">No departments achieved quota.</p>';
            if(missCounter === 0) missedContainer.innerHTML = '<p class="text-xs text-gray-600 italic p-2">All departments hit targets!</p>';
        }

        window.onload = async () => {
            initCharts();
            const { data } = await supabaseClient.from('revenue_targets').select('department, month').limit(2000);
            if (!data) return;

            const uniqueDepts = [...new Set(data.map(item => item.department))].sort();
            uniqueDepts.forEach(dept => {
                const opt = document.createElement('option');
                opt.value = dept; opt.innerHTML = dept; opt.className = "bg-gray-950 text-gray-200";
                document.getElementById('deptSelect').appendChild(opt);
            });

            const uniqueMonths = [...new Set(data.map(item => (item.month || "").trim()))]
                .sort((a, b) => {
                    const idxA = MONTH_ORDER.findIndex(m => a.startsWith(m));
                    const idxB = MONTH_ORDER.findIndex(m => b.startsWith(m));
                    return idxA - idxB;
                });
            uniqueMonths.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.innerHTML = m; opt.className = "bg-gray-950 text-gray-200";
                document.getElementById('monthSelect').appendChild(opt);
            });

            document.getElementById('monthSelect').addEventListener('change', refreshData);
            document.getElementById('deptSelect').addEventListener('change', refreshData);
            
            setTimeout(refreshData, 100);
        };
    </script>
</body>
