name: Build and Deploy

# Trigger the workflow whenever code is pushed to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Clean-install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the app with injected GitHub Secrets
      - name: Build project
        env:
          # For Next.js projects:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

          # If you are using Vite/React instead, use these names:
          # VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
